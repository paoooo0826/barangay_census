<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Barangay UI review</title><style>body{margin:0;background:#e2e7de;color:#173d33;font-family:Arial,sans-serif}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:#fbf9f3;border-bottom:1px solid #cdd6cd}label{display:flex;gap:8px;align-items:center;font-size:13px}select,button{padding:10px;border:1px solid #cdd6cd;border-radius:8px;background:white;color:#173d33}iframe{display:block;box-sizing:border-box;margin:16px auto;border:1px solid #cdd6cd;background:#fbf9f3;max-width:none;height:900px}small{padding:0 12px}#stage{overflow:auto}</style></head><body><header><strong>UI review only</strong><label>Screen<select id="screen"><option value="landing">Landing</option><option value="resident-login">Resident login</option><option value="admin-login">Admin login</option><option value="resident">Resident dashboard</option><option value="census">Census form</option><option value="registration">ID registration</option><option value="admin">Admin dashboard</option><option value="review">Admin review</option></select></label><button data-width="320">Mobile 320</button><button data-width="390">Mobile 390</button><button data-width="768">Tablet 768</button><button data-width="1024">Laptop 1024</button><button data-width="1440">Desktop 1440</button><span id="size">1440 × 900</span></header><small>Isolated sample records · No connection to the live database · No real saves or bookings</small><div id="stage"><iframe id="preview" title="App preview" src="/ui-frame.html?screen=landing" width="1440"></iframe></div><script>const frame=document.getElementById('preview');document.getElementById('screen').addEventListener('change',e=>frame.src='/ui-frame.html?screen='+e.target.value);document.querySelectorAll('[data-width]').forEach(b=>b.addEventListener('click',()=>{frame.width=b.dataset.width;document.getElementById('size').textContent=b.dataset.width+' × 900'}));</script></body></html>
